# lazyDesk 配置文件
# 所有可配置项集中于此，程序启动时读取，禁止硬编码

server:
  port: 8080                # HTTP/WebSocket 服务端口
  host: "0.0.0.0"           # 监听地址 (0.0.0.0 表示允许局域网内其他设备连接)

ffmpeg:
  # ffmpeg 可执行文件路径 (留空则使用系统 PATH 中的 ffmpeg)
  path: ""
  # 屏幕捕获参数
  screen:
    framerate: 60            # 捕获帧率 (NVENC 推荐 60fps)
    codec: "h264_nvenc"      # 视频编码器: h264_nvenc (GPU硬编码) | libx264 (CPU软编码)
    preset: "p1"             # NVENC: p1(最快)~p7(最佳画质) | x264: ultrafast...
    tune: "ll"               # NVENC: ll(低延迟) | x264: zerolatency
    pix_fmt: ""              # NVENC: 留空自动选择. x264: yuv420p
    profile: "baseline"      # H.264 profile: baseline(最大兼容) | high(更好压缩)
    bitrate: "15M"           # 视频码率 (1080p60 推荐 15M, LAN 可设 8-20M)
    gop_size: 60             # IDR 帧间隔 (1秒@60fps, 新客户端最多等1秒即可解码)

    # 捕获方式
    capture:
      method: "ddagrab"      # ddagrab (GPU零拷贝) | gdigrab (CPU回退)
      output_idx: 0          # 显示器索引 (0=主屏)
      draw_mouse: true       # 是否渲染光标到捕获画面
      dup_frames: false      # false=不填充重复帧(更低延迟) | true=恒定帧率

    # NVENC 硬编码专属参数 (仅 h264_nvenc 时生效)
    nvenc:
      rate_control: "cbr"    # 码率控制: cbr(恒定) | vbr | constqp
      maxrate: "15M"         # 峰值码率 (= bitrate 则为纯 CBR)
      bufsize: "250K"        # VBV 缓冲 (~bitrate/framerate = 1帧大小)
      b_frames: 0            # B 帧数 (0=无重排序延迟)
      multipass: 0           # 两通编码 (0=禁用)
      delay: 0               # async_depth (0=零延迟)
      no_scenecut: true      # 禁用场景切换检测
      rc_lookahead: 0        # 前瞻帧数 (0=禁用)
      b_ref_mode: 0          # B帧作为参考 (0=禁用)
      nonref_p: true         # 允许非参考P帧

  # 音频捕获参数
  audio:
    # 音频设备关键词 (按括号前主名模糊匹配, 如 "立体声混音")
    device: "立体声混音"
    codec: "libopus"         # 音频编码器 (Opus 为 WebRTC 原生格式)
    bitrate: "128k"          # 音频比特率

webrtc:
  # ICE 服务器 (局域网内不需要 STUN/TURN，留空即可)
  ice_servers: []

control:
  # DPI 缩放补偿 (已废弃: v2 按 ffmpeg 实际采集分辨率精确映射坐标)
  dpi_scale: 1.0

  # 长按判定时间 (毫秒)
  long_press_ms: 500

power:
  # 电源控制是否启用
  enabled: true
