<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,minimum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>lazyDesk</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<!-- 隐藏的 video: 接收 WebRTC 流, 不显示 -->
<video id="remoteVideo" autoplay playsinline muted style="display:none;"></video>

<!-- canvas: 渲染视频帧 + 触控映射层 -->
<canvas id="remoteCanvas"></canvas>

<!-- 透明触控覆盖层 (在 canvas 之上) -->
<div id="touchLayer"></div>

<!-- 连接遮罩 -->
<div id="connectOverlay">
  <div class="overlay-logo">🖥️ → 📱</div>
  <div class="overlay-text">正在连接 <span id="overlayHost"></span>...</div>
  <div class="overlay-form">
    <input type="text" id="overlayIP" placeholder="IP:端口">
    <button onclick="connectOverlay()">连接</button>
  </div>
  <div class="overlay-hint">自动连接失败时可手动输入</div>
</div>

<!-- 状态栏 -->
<div id="statusBar">
  <span id="statusDot"></span>
  <span id="statusText">连接中...</span>
</div>

<!-- 浮动按钮 -->
<button id="togglePanelBtn" onclick="togglePanel()" title="面板">⌨</button>
<button id="keyboardBtn" onclick="toggleKeyboard()" title="输入">✏️</button>

<!-- 虚拟按键面板 -->
<div id="controlPanel">
  <div class="key-row">
    <button class="mod-key" data-key="ctrl">Ctrl</button>
    <button class="mod-key" data-key="alt">Alt</button>
    <button class="mod-key" data-key="shift">Shift</button>
    <button class="mod-key" data-key="cmd">Win</button>
  </div>
  <div class="key-row">
    <button class="fn-key" onclick="sendKey('escape')">Esc</button>
    <button class="fn-key" onclick="sendKey('tab')">Tab</button>
    <button class="fn-key" onclick="sendKey('delete')">Del</button>
    <button class="fn-key" onclick="sendKey('enter')">↵</button>
    <button class="fn-key" onclick="sendKey('backspace')">⌫</button>
    <button class="fn-key" onclick="sendKey('space')">␣</button>
  </div>
  <div class="key-row">
    <button class="fn-key" onclick="sendKey('up')">↑</button>
    <button class="fn-key" onclick="sendKey('left')">←</button>
    <button class="fn-key" onclick="sendKey('down')">↓</button>
    <button class="fn-key" onclick="sendKey('right')">→</button>
  </div>
  <div class="key-row">
    <button class="macro-key" onclick="sendCombo(['ctrl','c'])">复制</button>
    <button class="macro-key" onclick="sendCombo(['ctrl','v'])">粘贴</button>
    <button class="macro-key" onclick="sendCombo(['alt','f4'])">Alt+F4</button>
    <button class="macro-key" onclick="sendCombo(['cmd','d'])">桌面</button>
    <button class="macro-key" onclick="sendCombo(['cmd','tab'])">切换</button>
  </div>
  <div class="key-row">
    <input type="text" id="textInput" placeholder="输入文本..." autocomplete="off" autocorrect="off" autocapitalize="off">
    <button onclick="sendText()" class="fn-key" style="flex:0 0 auto;min-width:50px;">发送</button>
  </div>
  <div class="key-row" style="margin-top:4px;">
    <button class="power-key" onclick="sendPower('monitor_off')">熄屏</button>
    <button class="power-key" onclick="sendPower('lock')">锁屏</button>
    <button class="power-key" onclick="sendPower('sleep')">睡眠</button>
    <button class="power-key danger" onclick="if(confirm('确定关机?'))sendPower('shutdown')">关机</button>
  </div>
</div>

<script src="/ws.js"></script>
<script src="/webrtc.js"></script>
<script src="/touch.js"></script>
<script src="/controls.js"></script>
<script src="/app.js"></script>

<script>
(function(){
  var h = window.location.host;
  var ipEl = document.getElementById('overlayIP');
  var hostEl = document.getElementById('overlayHost');
  if (ipEl) ipEl.value = h;
  if (hostEl) hostEl.textContent = h;
})();
function connectOverlay() {
  var ip = document.getElementById('overlayIP').value.trim();
  if (!ip) { alert('请输入 IP 地址'); return; }
  localStorage.setItem('lazyDesk_host', ip);
  if (typeof connect === 'function') connect();
  else if (typeof wsClient !== 'undefined') {
    if (typeof pc !== 'undefined' && pc) { pc.close(); pc = null; }
    wsClient.connect(ip);
  } else alert('脚本加载失败，请刷新页面');
}
</script>
</body>
</html>
