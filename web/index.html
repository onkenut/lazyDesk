<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,minimum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>lazyDesk</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<!-- 隐藏的 video: 接收 WebRTC 视频流, 由 canvas 绘制 -->
<video id="remoteVideo" autoplay playsinline muted style="display:none;"></video>
<!-- 音频输出 -->
<audio id="remoteAudio" autoplay></audio>

<!-- canvas: 渲染视频帧 + 触控映射层基准 -->
<canvas id="remoteCanvas"></canvas>

<!-- 透明触控覆盖层 -->
<div id="touchLayer"></div>

<!-- 连接遮罩 -->
<div id="connectOverlay">
  <div class="overlay-logo">🖥️ → 📱</div>
  <div class="overlay-text">正在连接 <span id="overlayHost"></span>...</div>
  <div class="overlay-form">
    <input type="text" id="overlayIP" placeholder="IP:端口">
    <button id="connectBtn">连接</button>
  </div>
  <div class="overlay-hint">自动连接失败时可手动输入</div>
</div>

<!-- 状态栏 -->
<div id="statusBar">
  <span id="statusDot"></span>
  <span id="statusText">连接中...</span>
  <span id="statsText"></span>
</div>

<!-- 事件提示 -->
<div id="eventToast" class="toast hidden"></div>

<!-- 浮动按钮 -->
<button id="togglePanelBtn" title="面板">▼</button>
<button id="keyboardBtn" title="输入">✏️</button>

<!-- 虚拟按键面板 -->
<div id="controlPanel">
  <div class="key-row">
    <button class="mod-key" data-key="ctrl">Ctrl</button>
    <button class="mod-key" data-key="alt">Alt</button>
    <button class="mod-key" data-key="shift">Shift</button>
    <button class="mod-key" data-key="cmd">Win</button>
  </div>
  <div class="key-row">
    <button class="fn-key" data-sendkey="escape">Esc</button>
    <button class="fn-key" data-sendkey="tab">Tab</button>
    <button class="fn-key" data-sendkey="delete">Del</button>
    <button class="fn-key" data-sendkey="enter">↵</button>
    <button class="fn-key" data-sendkey="backspace">⌫</button>
    <button class="fn-key" data-sendkey="space">␣</button>
  </div>
  <div class="key-row">
    <button class="fn-key" data-sendkey="up">↑</button>
    <button class="fn-key" data-sendkey="left">←</button>
    <button class="fn-key" data-sendkey="down">↓</button>
    <button class="fn-key" data-sendkey="right">→</button>
  </div>
  <div class="key-row">
    <button class="macro-key" data-combo="ctrl,c">复制</button>
    <button class="macro-key" data-combo="ctrl,v">粘贴</button>
    <button class="macro-key" data-combo="alt,f4">Alt+F4</button>
    <button class="macro-key" data-combo="cmd,d">桌面</button>
    <button class="macro-key" data-combo="cmd,tab">切换</button>
  </div>
  <div class="key-row">
    <input type="text" id="textInput" placeholder="输入文本..." autocomplete="off" autocorrect="off" autocapitalize="off">
    <button id="textSendBtn" class="fn-key" style="flex:0 0 auto;min-width:50px;">发送</button>
  </div>
  <div class="key-row" style="margin-top:4px;">
    <button class="power-key" data-power="monitor_off">熄屏</button>
    <button class="power-key" data-power="lock">锁屏</button>
    <button class="power-key" data-power="sleep">睡眠</button>
    <button class="power-key danger" data-power="shutdown">关机</button>
  </div>
</div>

<script type="module" src="/app.js"></script>
</body>
</html>
