<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>lazyDesk - Remote Desktop</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<!-- z-0: 视频播放层 (不响应事件) -->
<video id="remoteVideo" autoplay playsinline muted
       oncontextmenu="return false">
</video>

<!-- z-10: 透明触控覆盖层 (拦截所有手势) -->
<div id="touchLayer"></div>

<!-- z-20: 虚拟按键面板 -->
<div id="controlPanel">
  <!-- 连接状态 -->
  <div id="statusBar">
    <span id="statusDot"></span>
    <span id="statusText">连接中...</span>
    <input type="text" id="serverIP" placeholder="PC IP:8080"
           style="width:140px;background:#333;color:#eee;border:1px solid #555;border-radius:4px;padding:2px 6px;font-size:14px;">
    <button onclick="connect()" style="background:#4a9;color:#fff;border:none;border-radius:4px;padding:2px 8px;font-size:14px;">连接</button>
  </div>

  <!-- 修饰键行 -->
  <div class="key-row">
    <button class="mod-key" data-key="ctrl" id="ctrlKey">Ctrl</button>
    <button class="mod-key" data-key="alt" id="altKey">Alt</button>
    <button class="mod-key" data-key="shift" id="shiftKey">Shift</button>
    <button class="mod-key" data-key="cmd" id="winKey">Win</button>
  </div>

  <!-- 功能键行 -->
  <div class="key-row">
    <button class="fn-key" onclick="sendKey('escape')">Esc</button>
    <button class="fn-key" onclick="sendKey('tab')">Tab</button>
    <button class="fn-key" onclick="sendKey('delete')">Del</button>
    <button class="fn-key" onclick="sendKey('enter')">↵</button>
    <button class="fn-key" onclick="sendKey('backspace')">⌫</button>
    <button class="fn-key" onclick="sendKey('space')">␣</button>
  </div>

  <!-- 方向键 -->
  <div class="key-row">
    <button class="fn-key" onclick="sendKey('up')">↑</button>
    <button class="fn-key" onclick="sendKey('down')">↓</button>
    <button class="fn-key" onclick="sendKey('left')">←</button>
    <button class="fn-key" onclick="sendKey('right')">→</button>
  </div>

  <!-- 快捷宏 -->
  <div class="key-row">
    <button class="macro-key" onclick="sendCombo(['ctrl','c'])">Ctrl+C</button>
    <button class="macro-key" onclick="sendCombo(['ctrl','v'])">Ctrl+V</button>
    <button class="macro-key" onclick="sendCombo(['alt','f4'])">Alt+F4</button>
    <button class="macro-key" onclick="sendCombo(['cmd','d'])">Win+D</button>
    <button class="macro-key" onclick="sendCombo(['cmd','tab'])">Win+Tab</button>
  </div>

  <!-- 文字输入 -->
  <div class="key-row">
    <input type="text" id="textInput" placeholder="输入文本后点发送..."
           style="flex:1;background:#333;color:#eee;border:1px solid #555;border-radius:4px;padding:4px 8px;font-size:14px;">
    <button onclick="sendText()" class="fn-key">发送</button>
  </div>

  <!-- 电源控制 -->
  <div class="key-row" style="margin-top:8px;">
    <button class="power-key" onclick="sendPower('monitor_off')" title="关闭显示器">熄屏</button>
    <button class="power-key" onclick="sendPower('lock')" title="锁定">锁屏</button>
    <button class="power-key" onclick="sendPower('sleep')" title="睡眠">睡眠</button>
    <button class="power-key danger" onclick="if(confirm('确定要关机吗?'))sendPower('shutdown')" title="关机">关机</button>
  </div>
</div>

<script src="/ws.js"></script>
<script src="/webrtc.js"></script>
<script src="/touch.js"></script>
<script src="/controls.js"></script>
<script src="/app.js"></script>
</body>
</html>
